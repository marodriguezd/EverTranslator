name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. v3.1.25)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Keystore for Signed Release Build
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "Decoding KEYSTORE_BASE64 secret..."
            echo "${KEYSTORE_BASE64}" | base64 -d > keystore/release.keystore
            echo "KEYSTORE_FILE=${GITHUB_WORKSPACE}/keystore/release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD:-android}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${KEY_ALIAS:-releasekey}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${KEY_PASSWORD:-android}" >> $GITHUB_ENV
          else
            echo "No KEYSTORE_BASE64 secret found. Generating self-signed release keystore for GitHub release..."
            keytool -genkeypair -v \
              -keystore keystore/release.keystore \
              -alias releasekey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=EverTranslator, OU=Dev, O=EverTranslator, L=City, S=State, C=US"
            echo "KEYSTORE_FILE=${GITHUB_WORKSPACE}/keystore/release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=releasekey" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

      - name: Build APKs with Gradle
        run: ./gradlew assembleDevDebug assembleDevRelease

      - name: Prepare Release Artifacts
        id: prepare_artifacts
        run: |
          set -euo pipefail
          mkdir -p release_assets

          TAG_NAME="${{ inputs.tag_name || github.ref_name }}"
          echo "Tag name: ${TAG_NAME}"

          echo "APKs produced by the build:"
          find main/build/outputs/apk -name '*.apk' -print

          found=0
          for apk in $(find main/build/outputs/apk -name '*.apk' | sort); do
            filename="$(basename "$apk")"
            clean_name="${filename#-unsigned}"
            clean_name="${clean_name#main-}"
            cp "$apk" "release_assets/EverTranslator-${TAG_NAME}-${clean_name}"
            found=1
          done

          if [ "$found" -eq 0 ]; then
            echo "::error::No APK was produced by the build"
            exit 1
          fi

          echo "Release assets created:"
          ls -la release_assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: Release ${{ inputs.tag_name || github.ref_name }}
          files: release_assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
