name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. v3.1.25)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs with Gradle
        run: ./gradlew assembleDevDebug assembleDevRelease

      - name: Prepare Release Artifacts
        id: prepare_artifacts
        run: |
          set -euo pipefail
          mkdir -p release_assets

          TAG_NAME="${{ inputs.tag_name || github.ref_name }}"
          echo "Tag name: ${TAG_NAME}"

          echo "APKs produced by the build:"
          find main/build/outputs/apk -name '*.apk' -print

          # The dev flavour is not signed, so the release APK is emitted as
          # 'main-dev-release-unsigned.apk'. Copy whatever the build actually
          # produced instead of assuming a fixed file name.
          found=0
          for apk in $(find main/build/outputs/apk -name '*.apk' | sort); do
            base="$(basename "$apk" .apk)"
            cp "$apk" "release_assets/EverTranslator-${TAG_NAME}-${base#main-}.apk"
            found=1
          done

          if [ "$found" -eq 0 ]; then
            echo "::error::No APK was produced by the build"
            exit 1
          fi

          echo "Release assets created:"
          ls -la release_assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: Release ${{ inputs.tag_name || github.ref_name }}
          files: release_assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
